<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container{
        display:flex;
        justify-content: center;
        align-items: center;
        
      }
      .pricing-plan{
        align-items:center;
        background-color: rgb(183, 179, 187);
        flex-direction: column;
        text-align: center;
        margin:20px;
        max-width: 300px;
        padding: 20px;
        
      } 
      .plan-price{
        font-size: 30px;
        
      }
      .plan-button{
        background-color: rgb(245, 98, 7);
        width:fit-content;
        border-radius: 20%;
        text-align: center;
      }
      .pricing-plan{
      height:200px;
      
      }
      .plan-price{
        font-weight: bold;
        margin-bottom: 8px;;
      }
      .plan-title{
        color:rgb(6, 56, 17);
        font-weight: bold;
      }
      .plan-features{
        text-align: center;
        list-style: none;
        padding: 0;
        margin:0;
      }
      .plan-features li{
        margin-bottom: 10px;

      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction: column;
          height:100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
